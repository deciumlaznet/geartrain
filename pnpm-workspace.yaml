packages:
  - "packages/*"
  - "apps/*"

# Replit builds run pnpm without a terminal; never stop to ask before
# rebuilding node_modules.
confirmModulesPurge: false

# Use whichever pnpm the host provides. Same as .npmrc, repeated here because
# Replit's workspace does not keep the .npmrc file, and without it the publish
# build tries to download the pinned pnpm and fails.
managePackageManagerVersions: false
